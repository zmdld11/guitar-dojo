build:
  maxIssues: 0

complexity:
  LongParameterList:
    active: false
  # Compose 的 @Composable 函数天然偏长，长度限制对它不适用
  LongMethod:
    ignoreAnnotated: ['Composable']

naming:
  # Compose 约定 Composable 函数使用大驼峰
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  # 音高检测等算法用卫语句提前返回比强行单出口更清楚
  ReturnCount:
    max: 6
  LoopWithTooManyJumpStatements:
    maxJumpCount: 2

