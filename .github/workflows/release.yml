# 职责：发布——打 tag 时构建签名 APK、生成 Release 并附制品。
# 触发：推送 v*.*.* 形式的 tag（如 v0.1.0）。
# 产出：GitHub Release + 签名 APK。
# 状态：M8 里程碑前为占位，签名密钥与 Release 步骤在 #35 补全。
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Placeholder
        run: echo "Release 流程将在 M8（#35）补全：签名构建 + CHANGELOG + Release。"
